name: yct_app
description: Yoga Consciousness Trust — Official App
publish_to: 'none'
version: 1.4.1+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.3.0
  cloud_firestore: ^5.3.0
  firebase_crashlytics: ^4.1.0
  firebase_remote_config: ^5.1.0   # R2: Remote Config
  firebase_auth: ^5.1.0            # R2: Silent auth

  # Networking
  http: ^1.2.0

  # PDF viewer
  webview_flutter: ^4.4.4

  # Audio
  audioplayers: ^6.0.0
  audio_session: ^0.1.21

  # Utilities
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  connectivity_plus: ^6.0.3
  package_info_plus: ^8.0.0        # R2: App version for force update

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/yct_logo.png
    - assets/images/guruji.jpg
