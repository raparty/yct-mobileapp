name: Build & Deploy YCT

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── Job 1: Build Android ──────────────────────────────────────────────────
  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Inject keystore
        run: echo '${{ secrets.KEYSTORE_BASE64 }}' | base64 --decode > android/app/yct-release.jks

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APKs (split by ABI)
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info
        env:
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Build AAB (Play Store)
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info
        env:
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: yct-arm64-apk
          retention-days: 30
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload arm32 APK
        uses: actions/upload-artifact@v4
        with:
          name: yct-arm32-apk
          retention-days: 30
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: yct-playstore-aab
          retention-days: 30
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: yct-debug-symbols
          retention-days: 30
          path: build/debug-info/

  # ── Job 2: Build iOS (Signed) and Upload to App Store ─────────────────────
  build_ios:
    name: Build iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install Apple Certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/distribution.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Install Provisioning Profile
        env:
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          PP_PATH=$RUNNER_TEMP/YCT_Distribution.mobileprovision
          echo -n "$APPLE_PROVISIONING_PROFILE" | base64 --decode -o $PP_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Install CocoaPods
        run: |
          cd ios
          pod update
          cd ..

      - name: Build Signed IPA
        run: flutter build ipa --release

      - name: Debug - Find all IPA files
        run: |
          echo "=== Searching for IPA files ==="
          find . -name "*.ipa" 2>/dev/null
          echo "=== build/ios contents ==="
          ls -la build/ios/ 2>/dev/null || echo "build/ios not found"
          echo "=== build/ios/ipa contents ==="
          ls -la build/ios/ipa/ 2>/dev/null || echo "build/ios/ipa not found"
          echo "=== build/ios/archive contents ==="
          ls -la build/ios/archive/ 2>/dev/null || echo "build/ios/archive not found"

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          IPA_PATH=$(find . -name "*.ipa" | head -1)
          echo "Found IPA at: $IPA_PATH"
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: No IPA found!"
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --username "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --asc-provider "$APPLE_TEAM_ID"

  # ── Job 3: Deploy Upload Worker ───────────────────────────────────────────
  deploy_worker:
    name: Deploy Upload Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Deploy yct-upload worker
        working-directory: cloudflare/worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5afa6e916ca8a0e330f044c1f7e41e44

  # ── Job 4: Deploy Admin Panel ─────────────────────────────────────────────
  deploy_admin:
    name: Deploy Admin Panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Deploy admin panel worker
        working-directory: cloudflare/admin
        run: npx wrangler deploy --name crimson-art-feea
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5afa6e916ca8a0e330f044c1f7e41e44
