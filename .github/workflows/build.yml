name: Build & Deploy YCT

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── Job 1: Build Android ──────────────────────────────────────────────────
  build_android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > android/app/google-services.json

      - name: Inject keystore
        run: echo '${{ secrets.KEYSTORE_BASE64 }}' | base64 --decode > android/app/yct-release.jks

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APKs (split by ABI)
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/debug-info
        env:
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Build AAB (Play Store)
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info
        env:
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: yct-arm64-apk
          retention-days: 30
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload arm32 APK
        uses: actions/upload-artifact@v4
        with:
          name: yct-arm32-apk
          retention-days: 30
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: yct-playstore-aab
          retention-days: 30
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: yct-debug-symbols
          retention-days: 30
          path: build/debug-info/

  # ── Job 2: Build iOS (unsigned IPA) ──────────────────────────────────────
  build_ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign
        continue-on-error: true

      - name: Find and package Runner.app as IPA
        run: |
          echo "=== Searching for Runner.app everywhere ==="
          find . -name "Runner.app" -type d 2>/dev/null

          # Find Runner.app wherever Flutter put it
          RUNNER_PATH=$(find . -name "Runner.app" -type d 2>/dev/null | grep -v "Payload" | head -1)

          if [ -n "$RUNNER_PATH" ]; then
            echo "Found Runner.app at: $RUNNER_PATH"
            # Get absolute path
            RUNNER_ABS=$(cd "$(dirname "$RUNNER_PATH")" && pwd)/$(basename "$RUNNER_PATH")
            echo "Absolute path: $RUNNER_ABS"
            # Check it has real content
            echo "Runner.app size: $(du -sh "$RUNNER_ABS")"

            mkdir -p /tmp/ipa_build/Payload
            cp -r "$RUNNER_ABS" /tmp/ipa_build/Payload/
            cd /tmp/ipa_build
            zip -r /tmp/YCT-unsigned.ipa Payload/
            echo "IPA size: $(du -sh /tmp/YCT-unsigned.ipa)"
            echo "IOS_BUILD_SUCCESS=true" >> $GITHUB_ENV
          else
            echo "ERROR: Runner.app not found anywhere"
            echo "IOS_BUILD_SUCCESS=false" >> $GITHUB_ENV
          fi

      - name: Upload IPA
        if: env.IOS_BUILD_SUCCESS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: yct-ios-unsigned-ipa
          retention-days: 30
          path: /tmp/YCT-unsigned.ipa

  # ── Job 3: Deploy Upload Worker ───────────────────────────────────────────
  deploy_worker:
    name: Deploy Upload Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Deploy yct-upload worker
        working-directory: cloudflare/worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5afa6e916ca8a0e330f044c1f7e41e44

  # ── Job 4: Deploy Admin Panel ─────────────────────────────────────────────
  deploy_admin:
    name: Deploy Admin Panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler@4

      - name: Deploy admin panel worker
        working-directory: cloudflare/admin
        run: npx wrangler deploy --name crimson-art-feea
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5afa6e916ca8a0e330f044c1f7e41e44
